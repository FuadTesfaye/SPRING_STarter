server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

services:
  inventory:
    base-url: http://localhost:8083
  payment:
    base-url: http://localhost:8082
  shipping:
    base-url: http://localhost:8084
  notification:
    base-url: http://localhost:8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
