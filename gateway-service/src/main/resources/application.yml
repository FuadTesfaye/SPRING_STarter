server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payments/**
        - id: inventory-service
          uri: http://inventory-service:8084
          predicates:
            - Path=/api/inventory/**
        - id: shipping-service
          uri: http://shipping-service:8085
          predicates:
            - Path=/api/shipping/**
        - id: product-service
          uri: http://product-service:8087
          predicates:
            - Path=/api/products/**
