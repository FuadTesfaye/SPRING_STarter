server:
  port: 8080

spring:
  application:
    name: api-gateway
  datasource:
    url: jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
