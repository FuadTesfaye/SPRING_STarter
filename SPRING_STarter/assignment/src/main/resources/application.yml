spring:
  application:
    name: auth-service
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8081

jwt:
  secret: mySuperSecretKeyForJWTTokenGeneration2025VeryLongAndSecure
  expiration: 86400000