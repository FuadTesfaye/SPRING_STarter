services:

  # ─── PostgreSQL — one instance, 5 databases ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: assignment-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: authdb,orderdb,paymentdb,inventorydb,shippingdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assignment-network

  # ─── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: assignment-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - assignment-network

  # ─── Auth Service (port 8081) ───────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      JWT_SECRET: Assignment2024SecretKeyMustBe256BitsLongForSecurity!!
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_BASE_URL: http://localhost:8081/api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - assignment-network

  # ─── Order Service (port 8082) ─────────────────────────────────────────────
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - assignment-network

  # ─── Payment Service (port 8083) ───────────────────────────────────────────
  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - assignment-network

  # ─── Inventory Service (port 8084) ─────────────────────────────────────────
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - assignment-network

  # ─── Shipping Service (port 8085) ──────────────────────────────────────────
  shipping-service:
    build: ./shipping-service
    container_name: shipping-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - assignment-network

  # ─── Notification Service (port 8086) ──────────────────────────────────────
  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - assignment-network

networks:
  assignment-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
