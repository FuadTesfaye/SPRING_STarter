services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  order-service:
    build: ./order-service
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  payment-service:
    build: ./payment-service
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  inventory-service:
    build: ./inventory-service
    ports:
      - "8084:8084"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  shipping-service:
    build: ./shipping-service
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  notification-service:
    build: ./notification-service
    ports:
      - "8086:8086"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  product-service:
    build: ./product-service
    ports:
      - "8087:8087"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  beauty-profile-service:
    build: ./beauty-profile-service
    ports:
      - "8088:8088"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  review-service:
    build: ./review-service
    ports:
      - "8089:8089"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  loyalty-service:
    build: ./loyalty-service
    ports:
      - "8090:8090"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  recommendation-service:
    build: ./recommendation-service
    ports:
      - "8091:8091"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  gateway-service:
    build: ./gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - order-service
      - payment-service
      - inventory-service
      - shipping-service
      - notification-service
      - product-service
      - beauty-profile-service
      - review-service
      - loyalty-service
      - recommendation-service

  storefront:
    build: ./storefront
    ports:
      - "3000:3000"
    depends_on:
      - gateway-service
