spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:authdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

server:
  port: 8081

app:
  jwt:
    secret: mySuperSecretKeyForDevelopmentOnly12345678901234567890
    expiration: 86400000